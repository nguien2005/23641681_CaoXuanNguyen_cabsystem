openapi: 3.0.3

info:
  title: JAM - Ride Booking API
  description: |
    API Swagger cho hệ thống đặt xe JAM.

    Các chức năng chính:
    - Đăng nhập
    - Quản lý thông tin cá nhân
    - Đặt xe
    - Tìm tài xế
    - Phân công tài xế
    - Theo dõi chuyến đi
    - Cập nhật trạng thái chuyến
    - Thanh toán
    - Đánh giá tài xế
    - Quản lý tài xế
    - Báo cáo
  version: 1.0.0

servers:
  - url: http://localhost:8080/api/v1
    description: Local Server

tags:
  - name: Authentication
    description: Xác thực người dùng
  - name: Customer
    description: Chức năng khách hàng
  - name: Driver
    description: Chức năng tài xế
  - name: Booking
    description: Quản lý đặt xe
  - name: Trip
    description: Quản lý chuyến đi
  - name: Payment
    description: Thanh toán
  - name: Review
    description: Đánh giá tài xế
  - name: Report
    description: Báo cáo

paths:

  # =====================================================
  # AUTHENTICATION
  # =====================================================

  /auth/login:
    post:
      tags:
        - Authentication
      summary: Đăng nhập
      description: Người dùng đăng nhập vào hệ thống.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Đăng nhập thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Dữ liệu không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Sai tài khoản hoặc mật khẩu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Tài khoản bị khóa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # =====================================================
  # CUSTOMER
  # =====================================================

  /customers/me:
    get:
      tags:
        - Customer
      summary: Xem thông tin cá nhân
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Thông tin khách hàng
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '401':
          description: Chưa đăng nhập
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      tags:
        - Customer
      summary: Cập nhật thông tin cá nhân
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCustomerRequest'
      responses:
        '200':
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '400':
          description: Dữ liệu không hợp lệ
        '401':
          description: Chưa đăng nhập

  # =====================================================
  # BOOKING
  # =====================================================

  /bookings:
    post:
      tags:
        - Booking
      summary: Đặt xe
      description: Khách hàng tạo yêu cầu đặt xe.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBookingRequest'
      responses:
        '201':
          description: Tạo yêu cầu đặt xe thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '400':
          description: Thiếu thông tin đặt xe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Chưa đăng nhập
        '409':
          description: Không thể tạo yêu cầu đặt xe

    get:
      tags:
        - Booking
      summary: Xem danh sách chuyến của khách hàng
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - searching_driver
              - driver_assigned
              - arriving_pickup
              - arrived_pickup
              - picked_up
              - in_progress
              - completed
              - cancelled
      responses:
        '200':
          description: Danh sách chuyến
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Booking'
        '401':
          description: Chưa đăng nhập

  /bookings/{booking_id}:
    get:
      tags:
        - Booking
      summary: Xem thông tin chuyến
      security:
        - bearerAuth: []
      parameters:
        - name: booking_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Thông tin chuyến
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '404':
          description: Không tìm thấy chuyến
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /bookings/{booking_id}/cancel:
    post:
      tags:
        - Booking
      summary: Hủy chuyến
      security:
        - bearerAuth: []
      parameters:
        - name: booking_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  example: Khách hàng thay đổi kế hoạch
      responses:
        '200':
          description: Hủy chuyến thành công
        '400':
          description: Không thể hủy chuyến
        '404':
          description: Không tìm thấy chuyến

  # =====================================================
  # DRIVER SEARCH
  # =====================================================

  /drivers/search:
    get:
      tags:
        - Driver
      summary: Tìm tài xế
      description: Tìm tài xế phù hợp với yêu cầu đặt xe.
      security:
        - bearerAuth: []
      parameters:
        - name: pickup_lat
          in: query
          required: true
          schema:
            type: number
            format: double
          example: 10.7769

        - name: pickup_lng
          in: query
          required: true
          schema:
            type: number
            format: double
          example: 106.7009

        - name: vehicle_type
          in: query
          required: true
          schema:
            type: string
            enum:
              - motorcycle
              - car
          example: car

      responses:
        '200':
          description: Danh sách tài xế phù hợp
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Driver'
        '404':
          description: Không tìm thấy tài xế phù hợp

  # =====================================================
  # DRIVER
  # =====================================================

  /drivers:
    get:
      tags:
        - Driver
      summary: Quản lý danh sách tài xế
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - available
              - busy
              - offline
      responses:
        '200':
          description: Danh sách tài xế
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Driver'
        '403':
          description: Không có quyền truy cập

  /drivers/{driver_id}:
    get:
      tags:
        - Driver
      summary: Xem thông tin tài xế
      security:
        - bearerAuth: []
      parameters:
        - name: driver_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Thông tin tài xế
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Driver'
        '404':
          description: Không tìm thấy tài xế

  /drivers/{driver_id}/status:
    put:
      tags:
        - Driver
      summary: Cập nhật trạng thái tài xế
      security:
        - bearerAuth: []
      parameters:
        - name: driver_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum:
                    - available
                    - busy
                    - offline
                  example: available
      responses:
        '200':
          description: Cập nhật thành công
        '400':
          description: Trạng thái không hợp lệ
        '404':
          description: Không tìm thấy tài xế

  /drivers/{driver_id}/location:
    put:
      tags:
        - Driver
      summary: Cập nhật vị trí tài xế
      security:
        - bearerAuth: []
      parameters:
        - name: driver_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - latitude
                - longitude
              properties:
                latitude:
                  type: number
                  format: double
                  example: 10.7769
                longitude:
                  type: number
                  format: double
                  example: 106.7009
      responses:
        '200':
          description: Cập nhật vị trí thành công
        '400':
          description: Vị trí không hợp lệ

  # =====================================================
  # TRIP
  # =====================================================

  /bookings/{booking_id}/status:
    put:
      tags:
        - Trip
      summary: Cập nhật trạng thái chuyến
      security:
        - bearerAuth: []
      parameters:
        - name: booking_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTripStatusRequest'
      responses:
        '200':
          description: Cập nhật trạng thái thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '400':
          description: Chuyển trạng thái không hợp lệ
        '404':
          description: Không tìm thấy chuyến

  /bookings/{booking_id}/assign:
    post:
      tags:
        - Trip
      summary: Phân công tài xế
      security:
        - bearerAuth: []
      parameters:
        - name: booking_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - driver_id
              properties:
                driver_id:
                  type: integer
                  example: 101
      responses:
        '200':
          description: Phân công tài xế thành công
        '400':
          description: Tài xế không phù hợp
        '404':
          description: Không tìm thấy chuyến hoặc tài xế

  /bookings/{booking_id}/accept:
    post:
      tags:
        - Trip
      summary: Tài xế nhận chuyến
      security:
        - bearerAuth: []
      parameters:
        - name: booking_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Nhận chuyến thành công
        '400':
          description: Không thể nhận chuyến
        '409':
          description: Chuyến đã được tài xế khác nhận

  /bookings/{booking_id}/reject:
    post:
      tags:
        - Trip
      summary: Tài xế từ chối chuyến
      security:
        - bearerAuth: []
      parameters:
        - name: booking_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  example: Không thể nhận chuyến
      responses:
        '200':
          description: Từ chối chuyến thành công
        '404':
          description: Không tìm thấy chuyến

  # =====================================================
  # PAYMENT
  # =====================================================

  /bookings/{booking_id}/fare:
    get:
      tags:
        - Payment
      summary: Tính và xem cước chuyến
      security:
        - bearerAuth: []
      parameters:
        - name: booking_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Thông tin cước
          content:
            application/json:
              schema:
                type: object
                properties:
                  booking_id:
                    type: integer
                    example: 10001
                  amount:
                    type: number
                    format: double
                    example: 85000
                  currency:
                    type: string
                    example: VND
        '400':
          description: Chuyến chưa hoàn thành

  /payments:
    post:
      tags:
        - Payment
      summary: Thanh toán chuyến đi
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentRequest'
      responses:
        '201':
          description: Thanh toán thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '400':
          description: Dữ liệu thanh toán không hợp lệ
        '402':
          description: Thanh toán thất bại
        '409':
          description: Chuyến đã thanh toán

  /payments/{payment_id}:
    get:
      tags:
        - Payment
      summary: Tra cứu giao dịch
      security:
        - bearerAuth: []
      parameters:
        - name: payment_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Thông tin giao dịch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '404':
          description: Không tìm thấy giao dịch

  # =====================================================
  # REVIEW
  # =====================================================

  /reviews:
    post:
      tags:
        - Review
      summary: Đánh giá tài xế
      description: Khách hàng đánh giá tài xế sau khi chuyến hoàn thành.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewRequest'
      responses:
        '201':
          description: Đánh giá thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Review'
        '400':
          description: Chuyến chưa hoàn thành hoặc điểm đánh giá không hợp lệ
        '409':
          description: Chuyến đã được đánh giá

  /drivers/{driver_id}/reviews:
    get:
      tags:
        - Review
      summary: Xem đánh giá tài xế
      parameters:
        - name: driver_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Danh sách đánh giá
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Review'

  # =====================================================
  # REPORT
  # =====================================================

  /reports/trips:
    get:
      tags:
        - Report
      summary: Báo cáo chuyến đi
      security:
        - bearerAuth: []
      parameters:
        - name: from_date
          in: query
          required: true
          schema:
            type: string
            format: date
          example: 2026-09-01

        - name: to_date
          in: query
          required: true
          schema:
            type: string
            format: date
          example: 2026-09-30

      responses:
        '200':
          description: Báo cáo chuyến đi
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_trips:
                    type: integer
                    example: 1250
                  completed_trips:
                    type: integer
                    example: 1100
                  cancelled_trips:
                    type: integer
                    example: 150
        '403':
          description: Không có quyền xem báo cáo

  /reports/revenue:
    get:
      tags:
        - Report
      summary: Báo cáo doanh thu
      security:
        - bearerAuth: []
      parameters:
        - name: from_date
          in: query
          required: true
          schema:
            type: string
            format: date

        - name: to_date
          in: query
          required: true
          schema:
            type: string
            format: date

      responses:
        '200':
          description: Báo cáo doanh thu
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_revenue:
                    type: number
                    format: double
                    example: 125000000
                  currency:
                    type: string
                    example: VND
        '403':
          description: Không có quyền xem báo cáo

components:

  # =====================================================
  # SECURITY
  # =====================================================

  securitySchemes:

    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  # =====================================================
  # SCHEMAS
  # =====================================================

  schemas:

    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          example: nguyenvana
        password:
          type: string
          format: password
          example: "123456"

    LoginResponse:
      type: object
      properties:
        access_token:
          type: string
          example: eyJhbGciOiJIUzI1NiIs...
        token_type:
          type: string
          example: Bearer
        user:
          $ref: '#/components/schemas/User'

    User:
      type: object
      properties:
        id:
          type: integer
          example: 1
        username:
          type: string
          example: nguyenvana
        full_name:
          type: string
          example: Nguyễn Văn A
        phone:
          type: string
          example: "0901234567"
        role:
          type: string
          enum:
            - customer
            - driver
            - operator
            - manager

    Customer:
      type: object
      properties:
        id:
          type: integer
          example: 1
        full_name:
          type: string
          example: Nguyễn Văn A
        phone:
          type: string
          example: "0901234567"
        email:
          type: string
          format: email
          example: nguyenvana@gmail.com

    UpdateCustomerRequest:
      type: object
      properties:
        full_name:
          type: string
          example: Nguyễn Văn A
        phone:
          type: string
          example: "0901234567"
        email:
          type: string
          format: email
          example: nguyenvana@gmail.com

    CreateBookingRequest:
      type: object
      required:
        - pickup_address
        - destination_address
        - vehicle_type
      properties:
        pickup_address:
          type: string
          example: Đại học Công nghiệp TP.HCM

        destination_address:
          type: string
          example: Sân bay Tân Sơn Nhất

        vehicle_type:
          type: string
          enum:
            - motorcycle
            - car
          example: car

    Booking:
      type: object
      properties:
        id:
          type: integer
          example: 10001
        customer_id:
          type: integer
          example: 1
        driver_id:
          type: integer
          nullable: true
          example: 101
        pickup_address:
          type: string
          example: Đại học Công nghiệp TP.HCM
        destination_address:
          type: string
          example: Sân bay Tân Sơn Nhất
        vehicle_type:
          type: string
          example: car
        status:
          type: string
          enum:
            - searching_driver
            - driver_assigned
            - arriving_pickup
            - arrived_pickup
            - picked_up
            - in_progress
            - completed
            - cancelled
          example: searching_driver
        fare:
          type: number
          format: double
          nullable: true
          example: 85000

    Driver:
      type: object
      properties:
        id:
          type: integer
          example: 101
        full_name:
          type: string
          example: Trần Văn B
        phone:
          type: string
          example: "0912345678"
        vehicle_type:
          type: string
          enum:
            - motorcycle
            - car
          example: car
        license_plate:
          type: string
          example: 51A-12345
        status:
          type: string
          enum:
            - available
            - busy
            - offline
          example: available
        rating:
          type: number
          format: float
          example: 4.8

    UpdateTripStatusRequest:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - arriving_pickup
            - arrived_pickup
            - picked_up
            - in_progress
            - completed
            - cancelled
          example: arriving_pickup

    PaymentRequest:
      type: object
      required:
        - booking_id
        - payment_method
      properties:
        booking_id:
          type: integer
          example: 10001
        payment_method:
          type: string
          enum:
            - cash
            - electronic
          example: electronic

    Payment:
      type: object
      properties:
        id:
          type: integer
          example: 50001
        booking_id:
          type: integer
          example: 10001
        amount:
          type: number
          format: double
          example: 85000
        payment_method:
          type: string
          enum:
            - cash
            - electronic
          example: electronic
        status:
          type: string
          enum:
            - pending
            - paid
            - failed
          example: paid
        transaction_code:
          type: string
          nullable: true
          example: TXN202609070001

    ReviewRequest:
      type: object
      required:
        - booking_id
        - rating
      properties:
        booking_id:
          type: integer
          example: 10001
        rating:
          type: integer
          minimum: 1
          maximum: 5
          example: 5
        comment:
          type: string
          nullable: true
          example: Tài xế phục vụ tốt.

    Review:
      type: object
      properties:
        id:
          type: integer
          example: 90001
        booking_id:
          type: integer
          example: 10001
        customer_id:
          type: integer
          example: 1
        driver_id:
          type: integer
          example: 101
        rating:
          type: integer
          minimum: 1
          maximum: 5
          example: 5
        comment:
          type: string
          nullable: true
          example: Tài xế phục vụ tốt.
        created_at:
          type: string
          format: date-time
          example: 2026-09-07T18:30:00Z

    ErrorResponse:
      type: object
      properties:
        code:
          type: string
          example: INVALID_REQUEST
        message:
          type: string
          example: Dữ liệu yêu cầu không hợp lệ.
